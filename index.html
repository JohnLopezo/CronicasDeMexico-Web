<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Crónicas de México</title>
<style>
  :root { --tinta: #efe6d6; --oro: #e0a23a; --jade: #3fa37a; --violeta: #9b6bd6; --fondo: #0d0b08; --panel: rgba(18, 14, 10, .88); --linea: #4a3c2c; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--fondo); color: var(--tinta);
    font: 15px/1.4 system-ui, sans-serif; user-select: none; -webkit-user-select: none; touch-action: none; }
  canvas { position: fixed; inset: 0; width: 100vw; height: 100vh; image-rendering: pixelated; }
  .oculto { display: none !important; }
  button { font: inherit; color: var(--tinta); background: #2a2119; border: 1px solid var(--linea); border-radius: 8px; padding: 10px 18px; cursor: pointer; }
  button:hover, button:focus-visible { border-color: var(--oro); outline: none; }

  #hud { position: fixed; left: max(12px, env(safe-area-inset-left)); top: 10px; right: max(12px, env(safe-area-inset-right)); pointer-events: none; }
  .barra { height: 12px; background: #000a; border: 1px solid var(--linea); border-radius: 3px; overflow: hidden; }
  .barra > i { display: block; height: 100%; width: 100%; background: #d4503e; transition: width .15s; }
  /* Etapa 35: panel compacto arriba a la izquierda (retrato con la marca del Guardián y su nivel; vida y energía con números
     dentro; experiencia fina; esquivas), la misión en una línea y el nivel de la mazmorra en una ficha arriba al centro. */
  #panel { display: flex; gap: 10px; align-items: center; width: min(250px, 42vw); padding: 6px 10px 6px 6px; background: #14100cb8;
    border: 1px solid var(--linea); border-radius: 12px; box-shadow: 0 2px 0 #0008; }
  #retrato { position: relative; flex: none; width: 44px; height: 44px; border-radius: 50%; background: radial-gradient(#3a2c1e, #1b140e);
    border: 2px solid var(--oro); display: grid; place-items: center; }
  #retrato img { width: 32px; height: 32px; image-rendering: pixelated; }
  #nvTxt { position: absolute; bottom: -7px; left: 50%; transform: translateX(-50%); background: var(--oro); color: #14100c; font-size: 10px;
    line-height: 13px; padding: 0 5px; border-radius: 6px; white-space: nowrap; }
  #barras { flex: 1; display: grid; gap: 3px; min-width: 0; }
  #panel .barra { position: relative; height: 14px; border-radius: 4px; }
  #panel .barra span { position: absolute; inset: 0; font-size: 10px; line-height: 13px; text-align: center; font-weight: bold; text-shadow: 0 1px 1px #000; }
  #panel .barra.ener > i { background: #4fa3d9; }
  #panel .barra.fina { height: 4px; margin: 0; }
  #esqTxt { font-size: 11px; line-height: 1; color: #e8d49a; letter-spacing: 2px; }
  #panel.baja .barra.vida { animation: latido .8s ease-in-out infinite; } /* poca vida: la barra late */
  @keyframes latido { 50% { box-shadow: 0 0 8px #ff4a3a; border-color: #ff6a5a; } }
  #objetivo { display: inline-block; margin-top: 8px; padding: 2px 10px; border-radius: 8px; background: #14100c99; font-size: 12px;
    max-width: min(340px, 44vw); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--oro); text-shadow: 0 1px 2px #000; }
  #objetivo:empty { display: none; }
  #zona { position: absolute; left: 50%; top: 0; transform: translateX(-50%); background: var(--panel); border: 1px solid var(--linea);
    border-radius: 12px; padding: 2px 12px; font-size: 12px; white-space: nowrap; }
  #jefe { position: fixed; left: 50%; transform: translateX(-50%); bottom: 18px; width: min(420px, 60vw); text-align: center; pointer-events: none; text-shadow: 0 1px 2px #000; }
  #jefe .barra > i { background: var(--violeta); }
  #ruptura { position: fixed; left: 50%; bottom: 58px; /* encima de la barra del jefe, que aquí está abajo */ transform: translateX(-50%); display: flex; gap: 6px; align-items: center; pointer-events: none;
    background: var(--panel); border: 1px solid var(--linea); border-radius: 6px; padding: 3px 10px; font-size: 13px; white-space: nowrap; }
  #rRombos { color: #e8d49a; letter-spacing: 1px; }
  .rDebilTxt { opacity: .75; }
  #rDebil span { color: #14100c; border-radius: 3px; padding: 0 5px; margin-left: 3px; font-size: 12px; }
  .af-agua { background: rgb(96, 160, 222); } .af-tierra { background: rgb(196, 146, 86); } .af-fuego { background: rgb(226, 104, 72); }
  .af-viento { background: rgb(150, 214, 160); } .af-luz { background: rgb(240, 214, 110); } #rDebil .af-oscuridad { background: rgb(150, 112, 200); color: #f5f0fa; }
  #rRota { color: #ffd660; }
  #aviso { position: fixed; left: 50%; top: 62%; transform: translateX(-50%); background: var(--panel); border: 1px solid var(--linea);
    padding: 4px 12px; border-radius: 6px; font-size: 13px; pointer-events: none; }
  #toast { position: fixed; left: 50%; top: 44px; transform: translateX(-50%); background: var(--panel); border: 1px solid var(--linea);
    padding: 6px 14px; border-radius: 8px; max-width: min(460px, 38vw); font-size: 13px; text-align: center; pointer-events: none; } /* bajo la ficha del nivel, sin pisar el panel */

  #dialogo { position: fixed; left: 50%; bottom: 16px; transform: translateX(-50%); width: min(720px, 92vw); min-height: 72px;
    background: var(--panel); border: 2px solid var(--linea); border-radius: 10px; padding: 12px 16px 22px; cursor: pointer; }
  #dialogo b { color: var(--oro); display: block; margin-bottom: 4px; }
  #dialogo small { position: absolute; right: 12px; bottom: 6px; opacity: .6; }

  .capa { position: fixed; inset: 0; display: grid; place-items: center; background: #000b; }
  .caja { background: var(--panel); border: 2px solid var(--linea); border-radius: 12px; padding: 22px 26px; text-align: center; min-width: 260px; max-width: 92vw; }
  .caja h1 { margin: 0 0 4px; font-size: 26px; color: var(--oro); letter-spacing: .5px; }
  .caja p { margin: 4px 0 16px; opacity: .8; }
  .caja .botones { display: grid; gap: 10px; }
  #fundido { position: fixed; inset: 0; background: #000; opacity: 0; pointer-events: none; transition: opacity .25s; }

  /* Controles táctiles: solo con pantalla táctil */
  .tactil { display: none; }
  body.es-tactil .tactil { display: block; }
  #stick { position: fixed; left: max(24px, env(safe-area-inset-left)); bottom: 24px; width: 128px; height: 128px; border-radius: 50%;
    background: #ffffff14; border: 2px solid #ffffff30; }
  #perilla { position: absolute; left: 50%; top: 50%; width: 56px; height: 56px; margin: -28px 0 0 -28px; border-radius: 50%; background: #ffffff40; }
  .tbtn { position: fixed; border-radius: 50%; background: #ffffff1c; border: 2px solid #ffffff40; color: var(--tinta); font-size: 13px;
    display: none; place-items: center; padding: 0; }
  body.es-tactil .tbtn { display: grid; }
  /* Etapa 31 (análisis de controles tipo Soul Knight): pocos botones, grandes y de color. Atacar hace también de Usar (mano
     dorada) junto a algo y de Seguir (▸) en un diálogo; Fijar queda en el teclado (el ataque ya apunta solo). Centro de Atacar a
     46 + --d px del borde derecho y 74 del de abajo; arco r = 108 px: Esquivar, Saltar, Defender; poderes a r = 185 px. */
  .tbtn { --d: max(28px, env(safe-area-inset-right)); --c: #e8e2d0; width: 62px; height: 62px; color: var(--c);
    background: radial-gradient(circle at 50% 35%, #3a3646ee, #1b1922ee 70%); border: 3px solid #5a566a;
    box-shadow: 0 3px 0 #0009, inset 0 0 0 2px color-mix(in srgb, var(--c) 40%, transparent); transition: transform .06s; }
  .tbtn svg { width: 54%; height: 54%; fill: currentColor; fill-opacity: .22; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round;
    stroke-linejoin: round; pointer-events: none; filter: drop-shadow(0 0 4px var(--c)); }
  .tbtn[data-espera]:not([data-espera=""]) svg { opacity: .3; }
  .tbtn[data-espera]:not([data-espera=""])::after { content: attr(data-espera); position: absolute; font-size: 16px; font-weight: bold; }
  .tbtn .mano, .tbtn .seguir, #bAtacar.usar .espada, #bAtacar.seguir .espada { display: none; }
  #bAtacar.usar .mano, #bAtacar.seguir .seguir { display: block; }
  #bAtacar { --c: #ff7a5c; right: var(--d); bottom: 28px; width: 92px; height: 92px; }
  #bAtacar.usar, #bAtacar.seguir { --c: #ffd36a; }
  body.en-dialogo .tbtn:not(#bAtacar), body.en-dialogo #stick { visibility: hidden; } /* en un diálogo solo queda Seguir */
  #bEsquivar { --c: #7be08a; right: calc(var(--d) + 123px); bottom: 43px; }
  #bSaltar { --c: #8fd8ff; right: calc(var(--d) + 91px); bottom: 119px; }
  #bDefender { --c: #6aa8ff; right: calc(var(--d) + 15px); bottom: 151px; }
  #bTierra { --c: #e6b94a; right: calc(var(--d) + 189px); bottom: 106px; }
  #bEspecial { --c: #c58cff; right: calc(var(--d) + 107px); bottom: 203px; }
  #bArma { --c: #e8d49a; right: calc(var(--d) + 185px); bottom: 190px; width: 52px; height: 52px; }
  #bBolsa { --c: #e6b94a; top: 10px; right: calc(max(12px, env(safe-area-inset-right)) + 54px); width: 44px; height: 44px; border-radius: 10px; }
  /* En un celular en vertical: pedir que se gire (el juego se pausa al girarlo, ver juego.js). */
  #girar { position: fixed; inset: 0; z-index: 50; display: none; flex-direction: column; align-items: center; justify-content: center; gap: 18px;
    background: #000; color: var(--tinta); font-size: 18px; text-align: center; padding: 24px; }
  #girar .icono { font-size: 64px; animation: girar 2s ease-in-out infinite; }
  @keyframes girar { 0%, 30% { transform: rotate(0); } 60%, 100% { transform: rotate(-90deg); } }
  @media (orientation: portrait) { body.es-tactil #girar { display: flex; } }
  .tbtn.sostenido { transform: scale(.9); background: radial-gradient(circle at 50% 35%, color-mix(in srgb, var(--c) 45%, #1b1922), #1b1922 75%); }
  .tbtn.apagado { opacity: .4; filter: grayscale(.8); }
  .carta.guardian img { width: 64px; height: 64px; object-fit: contain; image-rendering: pixelated; justify-self: center; }
  .carta.guardian small { opacity: .75; }
  .carta.actual { border-color: var(--oro); }
  .barra.fina { height: 5px; margin-top: 2px; }
  .barra.fina > i { background: #4fa3d9; }
  .barra.fina.xp > i { background: var(--oro); }
  #avisos { position: fixed; right: calc(max(12px, env(safe-area-inset-right)) + 108px); /* deja sitio a Bolsa y Pausa */ top: 12px; display: grid; gap: 4px; justify-items: end; pointer-events: none; }
  #avisos > div { background: var(--panel); border: 1px solid var(--linea); border-radius: 6px; padding: 3px 10px; font-size: 13px; }
  .caja.ancha { width: min(760px, 94vw); max-height: 88vh; overflow: auto; text-align: left; }
  .pestanas { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 8px; }
  .pestanas .activa { border-color: var(--oro); color: var(--oro); }
  .pestanas [data-cerrar] { margin-left: auto; }
  .lista { display: grid; gap: 6px; }
  .fila { display: grid; grid-template-columns: 32px 1fr auto auto; gap: 10px; align-items: center; border-bottom: 1px solid #ffffff14; padding: 4px 0; }
  .fila img, .fila .ico { width: 32px; height: 32px; image-rendering: pixelated; }
  .fila.arma { grid-template-columns: 48px 1fr auto auto; } .fila.arma img { width: 48px; height: 48px; } /* armero: iconos que se vean */
  .fila small { opacity: .7; display: block; }
  .fila button { padding: 6px 12px; }
  .fila button:disabled { opacity: .35; cursor: default; }
  .fila .texto { white-space: pre-line; }
  .fila .texto small { display: block; margin-top: 2px; }
  .cuenta { font-size: 13px; opacity: .85; text-align: right; }
  .resumen { color: var(--oro); }
  .cartas { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 10px; margin-top: 10px; }
  .carta { display: grid; gap: 6px; text-align: left; padding: 14px; }
  .carta i { opacity: .8; }
  .carta span { color: var(--jade); }
  .nota { font-size: 48px; color: var(--oro); margin: 4px 0; text-align: center; }
  @media (max-width: 600px) { .fila { grid-template-columns: 32px 1fr; } }
  .opciones { display: grid; gap: 12px; text-align: left; margin: 8px 0 18px; }
  .opciones label { display: flex; justify-content: space-between; align-items: center; gap: 14px; }
  .opciones input[type=range] { width: 160px; accent-color: var(--oro); }
  .opciones input[type=checkbox] { width: 20px; height: 20px; accent-color: var(--oro); }
  #bPausa { position: fixed; top: 10px; right: max(12px, env(safe-area-inset-right)); width: 44px; height: 44px; border-radius: 8px; padding: 0; }
</style>
</head>
<body>
<canvas id="lienzo"></canvas>

<div id="hud" class="oculto">
  <div id="panel"><div id="retrato"><img id="retratoImg" alt=""><b id="nvTxt"></b></div>
    <div id="barras"><div class="barra vida"><i id="vidaBar"></i><span id="vidaTxt"></span></div><div class="barra ener"><i id="energiaBar"></i><span id="enerTxt"></span></div>
      <div class="barra fina xp"><i id="xpBar"></i></div><div id="esqTxt" aria-label="Esquivas"></div></div></div>
  <div id="zona" class="oculto"></div>
  <div id="objetivo"></div>
</div>
<div id="jefe" class="oculto"><div id="jefeNombre"></div><div class="barra"><i id="jefeBar"></i></div></div>
<div id="ruptura" class="oculto"><span id="rNombre"></span> <span id="rRombos"></span> <span class="rDebilTxt">Débil:</span><span id="rDebil"></span> <b id="rRota">¡RUPTURA!</b></div>
<div id="aviso" class="oculto"></div>
<div id="toast" class="oculto"></div>
<div id="avisos"></div>
<div id="dialogo" class="oculto"><b id="dQuien"></b><span id="dTexto"></span><small>continuar ▸</small></div>

<div id="stick" class="tactil oculto"><div id="perilla"></div></div>
<button id="bAtacar" class="tbtn oculto" data-acc="atacar" aria-label="Atacar"><svg class="seguir" viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg><svg class="mano" viewBox="0 0 24 24"><path d="M8 13V5a1.5 1.5 0 0 1 3 0v6M11 10V4a1.5 1.5 0 0 1 3 0v6M14 10V5a1.5 1.5 0 0 1 3 0v7c0 5-3 8-7 8s-6-3-7-6l-1-3a1.5 1.5 0 0 1 3-1l1 2"/></svg><svg class="espada" viewBox="0 0 24 24"><path d="M14.5 17.5 3 6V3h3l11.5 11.5M13 19l6-6M16 16l4 4M19 21l2-2"/></svg></button>
<button id="bEsquivar" class="tbtn oculto" data-acc="esquivar" aria-label="Esquivar"><svg viewBox="0 0 24 24"><path d="M5 5l7 7-7 7M13 5l7 7-7 7"/></svg></button>
<button id="bTierra" class="tbtn oculto" data-acc="tierra" aria-label="Tierra"><svg viewBox="0 0 24 24"><path d="M3 20l6-10 4 6 3-4 5 8z"/></svg></button>
<button id="bEspecial" class="tbtn oculto" data-acc="especial" aria-label="Especial"><svg viewBox="0 0 24 24"><path d="M12 3l2.6 5.6 6.1.7-4.5 4.2 1.2 6L12 16.6 6.6 19.5l1.2-6L3.3 9.3l6.1-.7z"/></svg></button>
<button id="bArma" class="tbtn oculto" data-acc="cambiar" aria-label="Cambiar arma"><svg viewBox="0 0 24 24"><path d="M4 8h14l-3-3M20 16H6l3 3"/></svg></button>
<button id="bDefender" class="tbtn oculto" data-acc="defender" aria-label="Defender"><svg viewBox="0 0 24 24"><path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/></svg></button>
<button id="bBolsa" class="tbtn oculto" data-acc="bolsa" aria-label="Bolsa"><svg viewBox="0 0 24 24"><path d="M5 8h14l-1 12H6zM9 8V6a3 3 0 0 1 6 0v2"/></svg></button>
<button id="bSaltar" class="tbtn oculto" data-acc="saltar" aria-label="Saltar"><svg viewBox="0 0 24 24"><path d="M12 18V5M6 11l6-6 6 6M4 21h16"/></svg></button>
<div id="girar"><div class="icono">📱</div><div>Gira el celular para jugar en horizontal</div></div>
<button id="bPausa" class="oculto" aria-label="Pausa">II</button>

<div id="inicio" class="capa">
  <div class="caja">
    <h1>Crónicas de México</h1>
    <p>Arco I · La Venta</p>
    <div class="botones">
      <button id="continuar" class="oculto">Continuar</button>
      <button id="nueva">Nueva partida</button>
      <button id="opcInicio">Opciones</button>
    </div>
  </div>
</div>
<div id="pausa" class="capa oculto">
  <div class="caja">
    <h1>Pausa</h1>
    <p id="pausaAyuda"></p>
    <div class="botones"><button id="reanudar">Continuar</button><button id="opcPausa">Opciones</button><button id="salir">Menú de inicio</button></div>
  </div>
</div>
<div id="capaMenu" class="capa oculto"></div>
<div id="opciones" class="capa oculto">
  <div class="caja">
    <h1>Opciones</h1>
    <div class="opciones">
      <label>Efectos <input type="range" id="oEfectos" min="0" max="1" step="0.05"></label>
      <label>Ambiente <input type="range" id="oAmbiente" min="0" max="1" step="0.05"></label>
      <label>Música <input type="range" id="oMusica" min="0" max="1" step="0.05"></label>
      <label><span>Sacudida de pantalla</span> <input type="checkbox" id="oSacudida"></label>
      <label><span>Vibración (táctil)</span> <input type="checkbox" id="oVibracion"></label>
    </div>
    <div class="botones"><button id="oCerrar">Volver</button></div>
  </div>
</div>
<div id="fundido"></div>

<script src="datos/sprites.js"></script>
<script src="datos/animales.js"></script>
<script src="datos/regiones.js"></script>
<script src="datos/narrativa.js"></script>
<script src="datos/recompensas.js"></script>
<script src="js/motor.js"></script>
<script src="js/sonido.js"></script>
<script src="js/musica.js"></script>
<script src="js/mundo.js"></script>
<script src="js/actores.js"></script>
<script src="js/guardian.js"></script>
<script src="js/movimiento.js"></script>
<script src="js/cuadros.js"></script>
<script src="js/fauna.js"></script>
<script src="js/animales.js"></script>
<script src="js/trampas.js"></script>
<script src="js/senda.js"></script>
<script src="js/juego.js"></script>
<script src="js/efectos.js"></script>
<script src="js/armas.js"></script>
<script src="js/pisos.js"></script>
<script src="js/niveles.js"></script>
<script src="js/palenque.js"></script>
<script src="js/recompensas.js"></script>
</body>
</html>
